# Configuración versionada para fine-tuning ClarityGuard (Unsloth + TRL SFT).
#
# DATASET: El dataset de entrenamiento (2,999 registros) está publicado en:
#   https://huggingface.co/datasets/CharlieBonito/clarity-guard-training-data
#
# Nota: estos perfiles documentan el pipeline reproducible usado durante iteraciones
# piloto. No uses este YAML como wording canonico de Kaggle para los hiperparametros finales.
# El wording canonico esta en KAGGLE_WRITEUP_CORRECTED.md: ClarityGuard v2, checkpoint 750,
# batch por dispositivo 1, gradient accumulation 4, effective batch 4. El r/alpha final no esta
# publicado como definitivo porque no esta independientemente verificado.
# El modelo publico final fue entrenado/exportado con Unsloth Studio sobre Gemma 4 E4B IT
# y publicado como checkpoint 750 en GGUF.

defaults:
  # QLoRA 4-bit + calidad en ~16 GB VRAM (RTX 5070 Ti)
  load_in_4bit: true
  max_seq_length: 4096
  lora_r: 48
  lora_alpha: 96
  lora_dropout: 0.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 200
  seed: 3407
  bf16: true
  gradient_checkpointing: true
  # Mensaje sistema: null = sin system (solo user+assistant como en el JSONL).
  # Si lo defines, se antepone al contenido del primer turno user (compatible Gemma).
  system_prompt: null
  # Quitar la línea [dataset_id=...] del texto user para inferencia limpia.
  strip_dataset_id_line: true
  # Gemma usa rol "model" en plantilla; el JSONL usa "assistant" → conversión automática en prepare.
  val_ratio: 0.02
  merge_and_save_16bit: false

profiles:
  pilot_1k:
    model_name: unsloth/gemma-2-2b-it
    data_file: ../manipulational_conversation_responses_train_messages.jsonl
    output_dir: ./outputs/clarityguard_pilot_1k
    num_train_epochs: 2
    max_steps: -1

  scale_10k:
    model_name: unsloth/gemma-2-2b-it
    # Coloca aquí tu JSONL de ~10k (mismo esquema que train_messages).
    data_file: ../manipulational_conversation_responses_train_messages_10k.jsonl
    output_dir: ./outputs/clarityguard_scale_10k
    num_train_epochs: 1
    max_steps: -1
    save_steps: 500
    # Con más datos, batch efectivo similar; opcional bajar LR:
    # learning_rate: 1.0e-4

  pilot_1k_normalized:
    model_name: unsloth/gemma-2-2b-it
    data_file: ../manipulational_conversation_responses_train_messages_normalized.jsonl
    output_dir: ./outputs/clarityguard_pilot_1k_normalized
    num_train_epochs: 2
    max_steps: -1

  # ──────────────────────────────────────────────
  # ClarityGuard v2 — Perfil de produccion
  # Gemma 4 E4B IT con QLoRA (Unsloth Studio)
  # Checkpoint activo: 750
  # Exportado a GGUF Q4_K_M
  #
  # NOTA: Los perfiles pilot_1k/* usan Gemma 2 2B para desarrollo rapido.
  # Este perfil documenta los hiperparametros del modelo final publicado.
  # El modelo fue entrenado via Unsloth Studio UI; este perfil es
  # la configuracion documentada para reproducibilidad del pipeline.
  # r/alpha no estan publicados como definitivos (no verificados independientemente).
  # ──────────────────────────────────────────────
  clarityguard_v2:
    model_name: unsloth/gemma-4-e4b-it
    data_file: ../manipulational_conversation_responses_train_messages.jsonl
    output_dir: ./outputs/clarityguard_v2
    num_train_epochs: 1
    max_steps: 750
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 4
    learning_rate: 1.5e-4
    lora_r: 48
    lora_alpha: 96
    lora_dropout: 0.0
    warmup_ratio: 0.03
    logging_steps: 10
    save_steps: 375
    seed: 3407
    bf16: true
    gradient_checkpointing: true
    load_in_4bit: true
    max_seq_length: 4096
    system_prompt: null
    strip_dataset_id_line: true
    val_ratio: 0.02
    merge_and_save_16bit: false
